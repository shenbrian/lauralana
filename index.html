<!-- ============ MATERIAL / WHY MOHAIR ============ -->
<section class="material" id="material">
  <div class="section-inner">
    <div class="section-head">
      <p class="eyebrow i18n" data-zh="材质故事" data-en="The Material"></p>
      <div class="title-row">
        <span class="yarn-mark yarn-mark--down"><svg><use href="#yarnball"></use></svg></span>
        <h2 class="section-title i18n" data-zh="为什么是马海毛" data-en="Why Mohair"></h2>
      </div>
      <p class="section-lede i18n"
        data-zh="马海毛取自安哥拉山羊，纤维中空、光泽天然，是世界上最轻盈保暖的动物纤维之一。我们的纱线精选自意大利几家历史悠久的马海毛纺线商——那里以远超寻常的色彩丰富度著称，也是 LAURA LANA 每件作品色彩格外浓郁的原因。"
        data-en="Mohair comes from the Angora goat — a hollow, lustrous fibre and one of the warmest, lightest animal fibres in the world. Every skein is chosen from a handful of historic Italian mohair spinners renowned for a depth of colour rarely found elsewhere — the reason LAURA LANA pieces read so vividly."></p>
    </div>

    <div class="feature-grid">
      <div class="feature">
        <span class="yarn-mark yarn-mark--right feature-yarn"><svg><use href="#yarnball"></use></svg></span>
        <h3 class="i18n" data-zh="天然光泽" data-en="Natural Halo & Luster"></h3>
        <p class="i18n" data-zh="马海毛纤维表面光滑，能反射光线，织物自带丝绸般的光泽与蓬松晕光。" data-en="Mohair's smooth fibre surface reflects light, giving every knit a silken sheen and soft halo."></p>
      </div>
      <div class="feature">
        <span class="yarn-mark yarn-mark--right feature-yarn"><svg><use href="#yarnball"></use></svg></span>
        <h3 class="i18n" data-zh="轻盈保暖" data-en="Lightweight Warmth"></h3>
        <p class="i18n" data-zh="纤维中空结构锁住空气，同等重量下保暖度远超羊毛，穿着轻盈不厚重。" data-en="A hollow fibre core traps air, giving far more warmth per gram than ordinary wool — cosy without the bulk."></p>
      </div>
      <div class="feature">
        <span class="yarn-mark yarn-mark--right feature-yarn"><svg><use href="#yarnball"></use></svg></span>
        <h3 class="i18n" data-zh="缤纷色谱" data-en="A Colour Story"></h3>
        <p class="i18n" data-zh="每一色都来自意大利纱线商的调色房，饱和、浓郁，是奢侈针织品里少见的大胆用色。" data-en="Every shade comes straight from the dye house — saturated and rich in a way rarely seen in luxury knitwear."></p>
      </div>
      <div class="feature">
        <span class="yarn-mark yarn-mark--right feature-yarn"><svg><use href="#yarnball"></use></svg></span>
        <h3 class="i18n" data-zh="慢工细作" data-en="Slow-Made, Not Mass-Made"></h3>
        <p class="i18n" data-zh="每件独一无二，由设计师本人定制编织，拒绝流水线生产，值得等待。" data-en="Each piece is singular, hand-knit to commission by the designer herself — never on a production line, always worth the wait."></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ CRAFT / PROCESS ============ -->

        <h2 class="section-title i18n" data-zh="从一根纱线到一件作品" data-en="From a Single Strand to a Finished Piece"></h2>
      </div>
    </div>

    <div class="process">
      <div class="process-step">
        <span class="process-num">01</span>
        <h3 class="i18n" data-zh="选纱" data-en="Sourcing the Yarn"></h3>
        <p class="i18n" data-zh="从意大利几家历史悠久的马海毛纺线商中精选纱线，为的是别处少见的浓郁色彩。" data-en="Yarn is hand-selected from a handful of historic Italian mohair spinners, chosen for a depth of colour rarely found elsewhere."></p>
      </div>
      <div class="process-step">
        <span class="process-num">02</span>
        <h3 class="i18n" data-zh="配色与设计" data-en="Colour & Design"></h3>
        <p class="i18n" data-zh="设计师先画版型，再从色卡中选定色彩，两者一同定稿。" data-en="The designer sketches the silhouette and settles on colour together, before a single stitch is cast on."></p>
      </div>
      <div class="process-step">
        <span class="process-num">03</span>
        <h3 class="i18n" data-zh="手工编织" data-en="Hand-Knitting"></h3>
        <p class="i18n" data-zh="设计师逐针手织，一件毛衣通常需要2–4周才能完成。" data-en="Each garment is worked stitch by stitch by hand — a sweater typically takes two to four weeks."></p>
      </div>
      <div class="process-step">
        <span class="process-num">04</span>
        <h3 class="i18n" data-zh="定型与缝合" data-en="Finishing"></h3>
        <p class="i18n" data-zh="手工缝合、蒸汽定型，最后逐件检验后方可出品。" data-en="Hand-finished, steam-blocked, and inspected piece by piece before it ever leaves the studio."></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ ABOUT ============ -->
<section class="about" id="about">
  <div class="section-inner about-inner">
    <div class="about-text">
      <p class="eyebrow i18n" data-zh="关于 LAURA LANA" data-en="About LAURA LANA"></p>
      <div class="title-row">
        <span class="yarn-mark yarn-mark--right"><svg><use href="#yarnball"></use></svg></span>
        <h2 class="section-title i18n" data-zh="一间小小的编织工作室" data-en="A Small Knitting Studio"></h2>
      </div>
      <p class="i18n"
        data-zh="LAURA LANA 是一个专注于马海毛手工编织的独立设计品牌。“Lana”在意大利语与西班牙语中意为“羊毛”——这也是我们全部工作的起点。我们相信衣物应当被珍视而非消耗：每一件作品都由设计师亲手绘制版型、亲手编织，不追随快时尚的节奏，只为把一根纱线的温度，织进真正会被穿很多年的衣服里。"
        data-en="LAURA LANA is an independent studio devoted to hand-knit mohair. “Lana” — Italian and Spanish for wool — is where everything we do begins. We believe clothing should be treasured, not consumed: every piece is pattern-drafted and hand-knit by the designer herself, at a pace that has nothing to do with fast fashion, so the warmth of a single strand of yarn ends up in something worth wearing for years."></p>
      <p class="i18n"
        data-zh="工作室位于澳洲，纱线却来自大半个地球外的意大利——那里的马海毛纺线商以异常浓郁的色彩闻名，这也是 LAURA LANA 的作品总是格外缤纷的原因。我们没有工厂、没有流水线，只有一双手、一台织机和许多个安静的编织夜晚。"
        data-en="The studio is based in Australia, while the yarn travels from the other side of the world — from a handful of Italian mohair mills renowned for an unusually rich colour range. It's why LAURA LANA pieces read so vividly. There is no factory, no assembly line — just a pair of hands, a set of needles, and many quiet evenings of knitting."></p>
    </div>
    <div class="about-visual">
      <div class="lookbook-frame">
        <img src="images/studio-rack-wide.jpg" alt="A rack of finished LAURA LANA mohair sweaters in the studio">
      </div>
      <span class="yarn-mark yarn-mark--left"><svg><use href="#yarnball"></use></svg></span>
    </div>
  </div>
</section>
