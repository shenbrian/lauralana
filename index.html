<!-- ============ MATERIAL / WHY MOHAIR ============ -->
<section class="material" id="material">
  <div class="section-inner">
    <p class="eyebrow i18n" data-zh="材质故事" data-en="The Material"></p>
    <h2 class="section-title i18n" data-zh="为什么是马海毛" data-en="Why Mohair"></h2>
    <p class="section-lede i18n"
      data-zh="马海毛取自安哥拉山羊，纤维中空、光泽天然，是世界上最轻盈保暖的动物纤维之一。我们坚持使用南半球、澳洲牧场出产的马海毛原毛，从源头保证每一缕纱线的品质。"
      data-en="Mohair comes from the Angora goat — a hollow, lustrous fibre and one of the warmest, lightest animal fibres in the world. We source raw mohair exclusively from pastures in the Southern Hemisphere, here in Australia, so every skein starts from a fibre we trust."></p>

    <div class="feature-grid">
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" class="ic-stroke"/><path d="M14 24c2-6 6-10 12-10M24 34c6 0 10-4 12-10" class="ic-stroke"/></svg>
        <h3 class="i18n" data-zh="天然光泽" data-en="Natural Halo & Luster"></h3>
        <p class="i18n" data-zh="马海毛纤维表面光滑，能反射光线，织物自带丝绸般的光泽与蓬松晕光。" data-en="Mohair's smooth fibre surface reflects light, giving every knit a silken sheen and soft halo."></p>
      </div>
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 48 48" fill="none"><path d="M24 8 C14 8 8 16 8 24 C8 34 16 40 24 40 C32 40 40 34 40 24 C40 16 34 8 24 8Z" class="ic-stroke"/><path d="M24 16v16M17 24h14" class="ic-stroke"/></svg>
        <h3 class="i18n" data-zh="轻盈保暖" data-en="Lightweight Warmth"></h3>
        <p class="i18n" data-zh="纤维中空结构锁住空气，同等重量下保暖度远超羊毛，穿着轻盈不厚重。" data-en="A hollow fibre core traps air, giving far more warmth per gram than ordinary wool — cosy without the bulk."></p>
      </div>
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 48 48" fill="none"><path d="M12 34c0-10 4-20 12-24 8 4 12 14 12 24" class="ic-stroke"/><path d="M18 34h12M20 40h8" class="ic-stroke"/></svg>
        <h3 class="i18n" data-zh="南半球血统" data-en="Southern Hemisphere Provenance"></h3>
        <p class="i18n" data-zh="原毛来自澳洲本地牧场安哥拉山羊，路径短、可追溯，减少运输与中间环节。" data-en="Raised on local Australian pastures, our fibre travels a short, traceable path from farm to atelier."></p>
      </div>
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 48 48" fill="none"><path d="M24 6l6 12 13 2-9.5 9 2.5 13-12-6.5L12 42l2.5-13L5 20l13-2 6-12Z" class="ic-stroke"/></svg>
        <h3 class="i18n" data-zh="慢工细作" data-en="Slow-Made, Not Mass-Made"></h3>
        <p class="i18n" data-zh="小批量、限量编织，拒绝流水线生产，每件作品都值得等待。" data-en="Made in small, limited runs — never on a production line. Every piece is worth the wait."></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ COLLECTION ============ -->

    <p class="section-lede i18n"
      data-zh="以下为部分作品展示，图片持续更新中。每件均为原创设计、手工编织，如需查看实物细节或预定，欢迎点击询价。"
      data-en="A selection from the studio — photography is being added as each piece is finished. All designs are original and hand-knit; tap Enquire for details or to reserve a piece."></p>

  </div>

<!-- ============ CRAFT / PROCESS ============ -->
<section class="craft" id="craft">
  <div class="section-inner">
    <p class="eyebrow i18n" data-zh="制作工艺" data-en="The Craft"></p>
    <h2 class="section-title i18n" data-zh="从一根纱线到一件作品" data-en="From a Single Strand to a Finished Piece"></h2>

    <div class="process">
      <div class="process-step">
        <span class="process-num">01</span>
        <h3 class="i18n" data-zh="选毛" data-en="Sourcing"></h3>
        <p class="i18n" data-zh="从澳洲牧场精选头等马海毛原毛，按光泽与手感分级筛选。" data-en="Prime-grade raw mohair is hand-selected from Australian farms for lustre and handle."></p>
      </div>
      <div class="process-step">
        <span class="process-num">02</span>
        <h3 class="i18n" data-zh="纺纱" data-en="Spinning"></h3>
        <p class="i18n" data-zh="原毛经清洗、梳理后纺成纱线，保留纤维天然的蓬松与光泽。" data-en="Cleaned and carded fibre is spun into yarn, keeping its natural loft and shine intact."></p>
      </div>
      <div class="process-step">
        <span class="process-num">03</span>
        <h3 class="i18n" data-zh="手工编织" data-en="Hand-Knitting"></h3>
        <p class="i18n" data-zh="设计师逐针手织，一件毛衣通常需要2–4周才能完成。" data-en="Each garment is worked stitch by stitch by hand — a sweater typically takes two to four weeks."></p>
      </div>
      <div class="process-step">
        <span class="process-num">04</span>
        <h3 class="i18n" data-zh="定型与缝合" data-en="Finishing"></h3>
        <p class="i18n" data-zh="手工缝合、蒸汽定型，最后逐件检验后方可出品。" data-en="Hand-finished, steam-blocked, and inspected piece by piece before it ever leaves the studio."></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ ABOUT ============ -->
<section class="about" id="about">
  <div class="section-inner about-inner">
    <div class="about-text">
      <p class="eyebrow i18n" data-zh="关于 LAURA LANA" data-en="About LAURA LANA"></p>
      <h2 class="section-title i18n" data-zh="一间小小的编织工作室" data-en="A Small Knitting Studio"></h2>
      <p class="i18n"
        data-zh="LAURA LANA 是一个专注于马海毛手工编织的独立设计品牌。“Lana”在意大利语与西班牙语中意为“羊毛”——这也是我们全部工作的起点。我们相信衣物应当被珍视而非消耗：每一件作品都由设计师亲手绘制版型、亲手编织，不追随快时尚的节奏，只为把一根纱线的温度，织进真正会被穿很多年的衣服里。"
        data-en="LAURA LANA is an independent studio devoted to hand-knit mohair. “Lana” — Italian and Spanish for wool — is where everything we do begins. We believe clothing should be treasured, not consumed: every piece is pattern-drafted and hand-knit by the designer herself, at a pace that has nothing to do with fast fashion, so the warmth of a single strand of yarn ends up in something worth wearing for years."></p>
      <p class="i18n"
        data-zh="工作室位于澳洲，也因此与本地马海毛牧场保持着长期而直接的合作。我们没有工厂、没有流水线，只有一双手、一台织机和许多个安静的编织夜晚。"
        data-en="The studio is based in Australia, working directly with local mohair farms. There is no factory, no assembly line — just a pair of hands, a set of needles, and many quiet evenings of knitting."></p>
    </div>
    <div class="about-visual">
      <div class="lookbook-frame">
        <svg class="frame-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="19" stroke="var(--ink)" stroke-width="1.1" fill="none"/>
          <circle cx="32" cy="32" r="11" stroke="var(--ink)" stroke-width="1.1" fill="none"/>
        </svg>
        <span class="frame-caption i18n" data-zh="工作室实景 · 拍摄中" data-en="Studio portrait · Photography in progress"></span>
      </div>
    </div>
  </div>
</section>

<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">

        data-en="Want details or sizing on a piece, or a bespoke colour and fit? Fill in the form, or reach us directly below — we usually reply within one to two business days."></p>

      <ul class="contact-list">

        <li><span class="contact-label i18n" data-zh="网站" data-en="Website"></span><span>www.lauralana.au</span></li>
      </ul>

    <form class="contact-form" id="contactForm">
      <label>
        <span class="i18n" data-zh="姓名" data-en="Name"></span>
        <input type="text" name="name" required>
      </label>
      <label>
        <span class="i18n" data-zh="邮箱 / 微信" data-en="Email / WeChat"></span>
        <input type="text" name="reach" required>
      </label>

        <span class="i18n" data-zh="感兴趣的作品（选填）" data-en="Piece you're interested in (optional)"></span>
        <input type="text" name="item" placeholder="例：暮色毛裙 / e.g. Dusk Dress">
      </label>
      <label>
        <span class="i18n" data-zh="留言" data-en="Message"></span>
        <textarea name="message" rows="4" required></textarea>
      </label>
      <button type="submit" class="btn btn-primary i18n" data-zh="发送询价" data-en="Send Enquiry"></button>
      <p class="form-note i18n" data-zh="提交后将通过您的邮件客户端发送给我们。" data-en="Submitting will open your email client to send this to us."></p>
    </form>
